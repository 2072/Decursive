name: Check and build addon

on:
  push:
    branches:
      - master
    tags:
      - '*'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename WhatsNew.md
        if: github.ref_type == 'branch'
        run: |
          mv -vf WhatsNew.md WhatsNew_.md
          echo "file moved"

      - name: Run luacheck
        uses: BigWigsMods/actions/luacheck@master
        with:
          args: -qo 011

  package-retail:
    needs: check
    if: >-
      !contains(github.event.head_commit.message, '#skipRetail') &&
      !contains(github.event.head_commit.message, '#foreverOnly') &&
      !contains(github.event.head_commit.message, '#skipAll')
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename WhatsNew.md
        if: github.ref_type == 'branch'
        run: mv -vf WhatsNew.md WhatsNew_.md
      - uses: BigWigsMods/packager@master

  package-forever:
    needs: check
    if: >-
      !contains(github.event.head_commit.message, '#skipForever') &&
      !contains(github.event.head_commit.message, '#skipAll')
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename WhatsNew.md
        if: github.ref_type == 'branch'
        run: mv -vf WhatsNew.md WhatsNew_.md
      - uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g forever

  package-classic:
    needs: check
    if: >-
      !contains(github.event.head_commit.message, '#auraRestrictedOnly') &&
      !contains(github.event.head_commit.message, '#retailOnly') &&
      !contains(github.event.head_commit.message, '#foreverOnly') &&
      !contains(github.event.head_commit.message, '#skipClassic') &&
      !contains(github.event.head_commit.message, '#skipAll')
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename WhatsNew.md
        if: github.ref_type == 'branch'
        run: mv -vf WhatsNew.md WhatsNew_.md
      - uses: BigWigsMods/packager@master
        with:
          args: -g classic

  package-mists:
    needs: check
    if: >-
      !contains(github.event.head_commit.message, '#auraRestrictedOnly') &&
      !contains(github.event.head_commit.message, '#retailOnly') &&
      !contains(github.event.head_commit.message, '#foreverOnly') &&
      !contains(github.event.head_commit.message, '#skipMop') &&
      !contains(github.event.head_commit.message, '#skipAll')
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename WhatsNew.md
        if: github.ref_type == 'branch'
        run: mv -vf WhatsNew.md WhatsNew_.md
      - uses: BigWigsMods/packager@master
        with:
          args: -g mists

  package-bcc:
    needs: check
    if: >-
      !contains(github.event.head_commit.message, '#auraRestrictedOnly') &&
      !contains(github.event.head_commit.message, '#retailOnly') &&
      !contains(github.event.head_commit.message, '#foreverOnly') &&
      !contains(github.event.head_commit.message, '#skipBcc') &&
      !contains(github.event.head_commit.message, '#skipAll')
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename WhatsNew.md
        if: github.ref_type == 'branch'
        run: mv -vf WhatsNew.md WhatsNew_.md
      - uses: BigWigsMods/packager@master
        with:
          args: -g bcc

  package-titan:
    needs: check
    if: >-
      !contains(github.event.head_commit.message, '#auraRestrictedOnly') &&
      !contains(github.event.head_commit.message, '#retailOnly') &&
      !contains(github.event.head_commit.message, '#foreverOnly') &&
      !contains(github.event.head_commit.message, '#skipTitan') &&
      !contains(github.event.head_commit.message, '#skipAll')
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename WhatsNew.md
        if: github.ref_type == 'branch'
        run: mv -vf WhatsNew.md WhatsNew_.md
      - uses: BigWigsMods/packager@master
        with:
          args: -g titan

  mark-prerelease:
    needs: [package-retail, package-forever, package-classic, package-mists, package-bcc, package-titan]
    if: always() && github.ref_type == 'tag' && contains(github.ref_name, '-RC')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mark release candidates as prereleases
        run: gh release edit "$GITHUB_REF_NAME" --prerelease
