name: Check and build addon

on:
  workflow_dispatch:
    inputs:
      forever_only:
        description: Only build the WoW Forever package
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
    tags:
      - '*'
    # paths-ignore:
    #- '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
        CF_API_KEY: ${{ secrets.CF_API_KEY }}
        #WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        #WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
        GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Rename WhatsNew.md
        if: github.ref_type == 'branch'
        run: |
           mv -vf WhatsNew.md WhatsNew_.md
           echo "file moved"

      - name: Run luacheck
        uses: BigWigsMods/actions/luacheck@master
        with:
          args: -qo 011

      - name: Package retail
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(github.event.head_commit.message, '#skipretail') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2.6.1

      - name: Package classic
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(github.event.head_commit.message, '#retailOnly') &&
          !contains(github.event.head_commit.message, '#skipclassic') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g classic

      - name: Package mists
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(github.event.head_commit.message, '#retailOnly') &&
          !contains(github.event.head_commit.message, '#skipmop') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g mists

      - name: Package bcc
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(github.event.head_commit.message, '#retailOnly') &&
          !contains(github.event.head_commit.message, '#skipbcc') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g bcc

      - name: Package wrath
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(github.event.head_commit.message, '#retailOnly') &&
          !contains(github.event.head_commit.message, '#skiptitan') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g titan

      - name: Package Forever
        if: >-
          !contains(github.event.head_commit.message, '#skipforever') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g forever

      - name: Verify Forever package
        if: >-
          !contains(github.event.head_commit.message, '#skipforever') &&
          !contains(github.event.head_commit.message, '#skipall')
        shell: bash
        run: |
          set -euo pipefail

          archives=()
          while IFS= read -r candidate; do
            candidate_toc="$(unzip -p "$candidate" 'Decursive/Decursive.toc' 2>/dev/null || true)"
            if grep -q '^## Interface: 16001' <<<"$candidate_toc"; then
              archives+=("$candidate")
            fi
          done < <(find .release -maxdepth 1 -type f -iname '*.zip' ! -iname '*nolib*')

          if [[ ${#archives[@]} -ne 1 ]]; then
            printf 'Expected one full Forever archive, found %d\n' "${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          toc="$(unzip -p "$archive" 'Decursive/Decursive.toc')"
          grep -q '^## Interface: 16001' <<<"$toc"
          ! grep -q '@project-' <<<"$toc"

          ace_db="$(unzip -p "$archive" 'Decursive/Libs/AceDB-3.0/AceDB-3.0.lua')"
          grep -q '"AceDB-3.0", 36' <<<"$ace_db"
          grep -q 'version > 16000 and version < 20000' <<<"$ace_db"

          en_us="$(unzip -p "$archive" 'Decursive/Localization/enUS.lua')"
          locale_entry_count="$(grep -c '^L\[' <<<"$en_us")"
          if [[ $locale_entry_count -lt 350 ]]; then
            printf 'Expected at least 350 English locale entries, found %d\n' "$locale_entry_count" >&2
            exit 1
          fi
          grep -Fq 'L["DEBUG_REPORT_HEADER"]' <<<"$en_us"
          grep -Fq 'L["OPT_OPTIONS_DISABLED_WHILE_IN_COMBAT"]' <<<"$en_us"

          debuffs_frame="$(unzip -p "$archive" 'Decursive/Dcr_DebuffsFrame.lua')"
          grep -q 'AddDispelTypeTexture' <<<"$debuffs_frame"
          ! grep -q ':SetAuraBorder(' <<<"$debuffs_frame"

      - name: Upload Forever test package
        if: >-
          github.ref_type == 'branch' &&
          !contains(github.event.head_commit.message, '#skipforever') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Decursive-Forever-${{ github.sha }}
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
